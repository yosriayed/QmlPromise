<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
<style>
  .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
  .grid { stroke: #21262d; stroke-width: 1; stroke-dasharray: 4,4; }
  .axis { stroke: #30363d; stroke-width: 1.5; }
  .title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; }
  .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
  .tick-text { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; text-anchor: end; }
  .col-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
  .col-desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; text-anchor: middle; }
  .delta-text { fill: #3fb950; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; text-anchor: middle; }
  .sub-note { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; text-anchor: middle; }
</style>
<rect width="850" height="360" class="bg"/>
<text x="60" y="32" class="title">Marginal Overhead: QmlPromise vs QFutureWatcher Callback</text>
<text x="60" y="52" class="subtitle">Extra microseconds added by ES6 Promise abstraction compared to ad-hoc JS callback (Lower is better)</text>
<line x1="60" y1="290.0" x2="810" y2="290.0" class="grid"/>
<text x="52" y="294.0" class="tick-text">+0 µs</text>
<line x1="60" y1="237.5" x2="810" y2="237.5" class="grid"/>
<text x="52" y="241.5" class="tick-text">+2 µs</text>
<line x1="60" y1="185.0" x2="810" y2="185.0" class="grid"/>
<text x="52" y="189.0" class="tick-text">+4 µs</text>
<line x1="60" y1="132.5" x2="810" y2="132.5" class="grid"/>
<text x="52" y="136.5" class="tick-text">+6 µs</text>
<line x1="60" y1="80.0" x2="810" y2="80.0" class="grid"/>
<text x="52" y="84.0" class="tick-text">+8 µs</text>
<line x1="60" y1="290" x2="810" y2="290" class="axis"/>
<rect x="121.8" y="190.3" width="64" height="99.7" rx="4" fill="#3fb950" stroke="#2ea043" stroke-width="1.5"/>
<text x="153.8" y="180.3" class="delta-text">+3.80 µs</text>
<text x="153.8" y="164.3" class="sub-note">(1.6× callback time)</text>
<text x="153.8" y="312" class="col-title">Ready (Batch 64)</text>
<text x="153.8" y="328" class="col-desc">Completed future, amortized throughput</text>
<rect x="309.2" y="187.3" width="64" height="102.7" rx="4" fill="#3fb950" stroke="#2ea043" stroke-width="1.5"/>
<text x="341.2" y="177.3" class="delta-text">+3.91 µs</text>
<text x="341.2" y="161.3" class="sub-note">(1.6× callback time)</text>
<text x="341.2" y="312" class="col-title">Pending (Batch 64)</text>
<text x="341.2" y="328" class="col-desc">Next event loop turn, amortized throughput</text>
<rect x="496.8" y="187.7" width="64" height="102.3" rx="4" fill="#3fb950" stroke="#2ea043" stroke-width="1.5"/>
<text x="528.8" y="177.7" class="delta-text">+3.90 µs</text>
<text x="528.8" y="161.7" class="sub-note">(1.4× callback time)</text>
<text x="528.8" y="312" class="col-title">Worker (Batch 64)</text>
<text x="528.8" y="328" class="col-desc">QtConcurrent thread pool, amortized</text>
<rect x="684.2" y="282.0" width="64" height="8.0" rx="4" fill="#3fb950" stroke="#2ea043" stroke-width="1.5"/>
<text x="716.2" y="272.0" class="delta-text">+0.30 µs</text>
<text x="716.2" y="256.0" class="sub-note">(1.0× callback time)</text>
<text x="716.2" y="312" class="col-title">Worker (Single B1)</text>
<text x="716.2" y="328" class="col-desc">Individual request roundtrip in real threads</text>
</svg>