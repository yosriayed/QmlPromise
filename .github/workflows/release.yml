name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and Publish Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev

      - name: Setup Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtdeclarative'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Unit Tests
        run: |
          cmake -B build-test -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQMLPROMISE_BUILD_TESTS=ON \
            -DQMLPROMISE_BUILD_DEMO=OFF
          cmake --build build-test
          ctest --test-dir build-test --output-on-failure

      - name: Generate Benchmark SVG Charts
        run: |
          python3 benchmarks/generate_charts.py

      - name: Package Header-Only Distribution
        run: |
          cmake -B build-dist -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQMLPROMISE_INSTALL=ON \
            -DQMLPROMISE_BUILD_TESTS=OFF \
            -DQMLPROMISE_BUILD_DEMO=OFF
          cmake --install build-dist --prefix dist/QmlPromise
          cd dist
          tar -czvf ../QmlPromise-${{ github.ref_name }}.tar.gz QmlPromise/
          zip -r ../QmlPromise-${{ github.ref_name }}.zip QmlPromise/
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QmlPromise-${{ github.ref_name }}.tar.gz
            QmlPromise-${{ github.ref_name }}.zip
            benchmarks/charts/*.svg
          generate_release_notes: true
