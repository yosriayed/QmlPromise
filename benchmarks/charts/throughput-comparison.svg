<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
<style>
  .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
  .grid { stroke: #21262d; stroke-width: 1; stroke-dasharray: 4,4; }
  .axis { stroke: #30363d; stroke-width: 1.5; }
  .title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; }
  .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
  .row-label { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; text-anchor: end; }
  .val-text { fill: #f0f6fc; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 600; }
  .val-text-green { fill: #3fb950; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; }
  .tick-text { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; text-anchor: middle; }
</style>
<rect width="850" height="300" class="bg"/>
<text x="30" y="32" class="title">Peak Throughput Comparison (Ready Future, Batch 64)</text>
<text x="30" y="52" class="subtitle">Operations delivered per second (Higher is better)</text>
<line x1="180.0" y1="70" x2="180.0" y2="260" class="grid"/>
<text x="180.0" y="280" class="tick-text">0</text>
<line x1="327.5" y1="70" x2="327.5" y2="260" class="grid"/>
<text x="327.5" y="280" class="tick-text">150k</text>
<line x1="475.0" y1="70" x2="475.0" y2="260" class="grid"/>
<text x="475.0" y="280" class="tick-text">300k</text>
<line x1="622.5" y1="70" x2="622.5" y2="260" class="grid"/>
<text x="622.5" y="280" class="tick-text">450k</text>
<line x1="770.0" y1="70" x2="770.0" y2="260" class="grid"/>
<text x="770.0" y="280" class="tick-text">600k</text>
<line x1="180" y1="70" x2="180" y2="260" class="axis"/>
<text x="168" y="93.0" class="row-label">Raw Queued Signal</text>
<rect x="180" y="78.0" width="521.3" height="22" rx="3" fill="#8b949e"/>
<text x="711.3" y="93.0" class="val-text">530,120 ops/s</text>
<text x="168" y="131.0" class="row-label">Continuation Signal</text>
<rect x="180" y="116.0" width="360.7" height="22" rx="3" fill="#58a6ff"/>
<text x="550.7" y="131.0" class="val-text">366,790 ops/s</text>
<text x="168" y="169.0" class="row-label">Watcher Signal</text>
<rect x="180" y="154.0" width="176.2" height="22" rx="3" fill="#d29922"/>
<text x="366.2" y="169.0" class="val-text">179,160 ops/s</text>
<text x="168" y="207.0" class="row-label">Watcher Callback</text>
<rect x="180" y="192.0" width="172.5" height="22" rx="3" fill="#f0883e"/>
<text x="362.5" y="207.0" class="val-text">175,418 ops/s</text>
<text x="168" y="245.0" class="row-label">QmlPromise</text>
<rect x="180" y="230.0" width="212.4" height="22" rx="3" fill="#3fb950" stroke="#2ea043" stroke-width="1.5"/>
<text x="402.4" y="245.0" class="val-text-green">216,035 ops/s</text>
</svg>