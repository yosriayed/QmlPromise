<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
<style>
  .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
  .grid { stroke: #21262d; stroke-width: 1; stroke-dasharray: 4,4; }
  .axis { stroke: #30363d; stroke-width: 1.5; }
  .title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; }
  .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
  .label { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }
  .tick-text { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; text-anchor: end; }
  .group-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
  .bar-val { fill: #f0f6fc; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 600; text-anchor: middle; }
  .bar-val-green { fill: #3fb950; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
  .legend-text { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }
</style>
<rect width="850" height="420" class="bg"/>
<text x="60" y="32" class="title">C++ ➔ QML Asynchronous Delivery Latency (Batch 64)</text>
<text x="60" y="52" class="subtitle">Amortized microseconds per operation (Lower is better) &bull; Tested on Qt 6.8 / C++20</text>
<rect x="340" y="26" width="10" height="10" rx="2" fill="#8b949e"/>
<text x="354" y="35" class="legend-text">Raw Signal</text>
